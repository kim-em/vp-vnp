name = "vp-vnp"
defaultTargets = ["Statement", "Challenge", "Solution", "Paper"]
allowNonModules = true
# The .olean files do not depend on the platform, so one cache serves every platform.
platformIndependent = true

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "NS1"

[[lean_lib]]
name = "Nc"

[[lean_lib]]
name = "Ov"

[[lean_lib]]
name = "Paper"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Statement"

# `lake exe cache get`: Mathlib's cache, then this project's (scripts/cache-get.sh).
[[lean_exe]]
name = "cache"
root = "scripts.Cache"

# Lake reads this table only from its system configuration, so scripts/cache-get.sh and CI set
# LAKE_CONFIG to this file. "vp-vnp" is the public read endpoint; "vp-vnp-upload" is the S3 API
# of the same R2 bucket, used by CI for `lake cache put`.
[cache]
defaultService = "vp-vnp"

[[cache.service]]
name = "vp-vnp"
kind = "s3"
artifactEndpoint = "https://vp-vnp-cache.taucetiproject.org/artifacts"
revisionEndpoint = "https://vp-vnp-cache.taucetiproject.org/revisions"
hasPackageScopes = false

[[cache.service]]
name = "vp-vnp-upload"
kind = "s3"
artifactEndpoint = "https://ec2169bdf033f56b009956d4b64ba8ef.r2.cloudflarestorage.com/vp-vnp-cache/artifacts"
revisionEndpoint = "https://ec2169bdf033f56b009956d4b64ba8ef.r2.cloudflarestorage.com/vp-vnp-cache/revisions"
hasPackageScopes = false
