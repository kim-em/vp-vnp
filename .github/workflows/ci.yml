name: CI

# Builds the project with Lake, fails on any `sorry` outside Challenge.lean, checks that the five
# theorems of Solution.lean use only propext, Classical.choice and Quot.sound, and then checks
# the proof with independent kernels:
#   con-leche  con-leche (master) --compare on lean4export files of Challenge and Solution
#   con-ron    con-ron (master) --compare on the same export files
#   nanoda     the nanoda_bin bundled with the toolchain, on the Solution export
# .lake/build and the con-leche and con-ron binaries are kept in the Actions cache. On a push to
# main, or a manual run on main, the build outputs are published for `lake exe cache get` (see
# the [cache] table of lakefile.toml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELAN_VERSION: v4.2.3
  ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
  # con-leche and con-ron master, for --compare. They can not read the v4.37 .olean format, so
  # they read lean4export files written by the toolchain's `leanexport`.
  CON_LECHE_COMMIT: bc6676101c488e21ce71a317b33905534d497e14
  CON_RON_COMMIT: e772d54f0590d0fbb8fbcd7e400c75831de1f443

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Computed before .lake/ exists, so that only this repository's files are hashed.
      - name: Compute the build cache key
        id: key
        run: |
          echo "key=lake-build-v2-${{ hashFiles('**/*.lean', 'lakefile.toml', 'lake-manifest.json', 'lean-toolchain') }}" >> "$GITHUB_OUTPUT"

      - name: Install elan
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # This package's `cache` executable shadows Mathlib's, so name Mathlib's explicitly.
      - name: Fetch the Mathlib cache
        run: lake exe mathlib/cache get

      - name: Restore the Lake build
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ${{ steps.key.outputs.key }}
          restore-keys: lake-build-v2-

      # With the artifact cache on, `-o` writes the input-to-output mappings of this package's
      # modules, and the artifacts they name are in LAKE_CACHE_DIR, for `lake cache put` below.
      - name: lake build
        env:
          LAKE_CONFIG: ${{ github.workspace }}/lakefile.toml
          LAKE_CACHE_DIR: ${{ runner.temp }}/lake-cache
          LAKE_ARTIFACT_CACHE: "true"
          LAKE_RESTORE_ARTIFACTS: "true"
        run: |
          set -o pipefail
          lake build -o "$RUNNER_TEMP/outputs.jsonl" 2>&1 | tee "$RUNNER_TEMP/lake-build.log"

      - name: Save the Lake build
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ${{ steps.key.outputs.key }}

      # Lake replays the stored warnings of up-to-date modules, so the log is complete even when
      # nothing was rebuilt. The five sorries of Challenge.lean must be there; any other fails.
      - name: No sorry outside Challenge.lean
        run: |
          grep -E 'declaration uses .sorry.' "$RUNNER_TEMP/lake-build.log" > "$RUNNER_TEMP/sorry.log" || true
          cat "$RUNNER_TEMP/sorry.log"
          if grep -v -E '(^|[ /])Challenge\.lean:' "$RUNNER_TEMP/sorry.log"; then
            echo "::error::sorry outside Challenge.lean"
            exit 1
          fi
          n="$(wc -l < "$RUNNER_TEMP/sorry.log")"
          if [ "$n" -ne 5 ]; then
            echo "::error::expected the 5 sorries of Challenge.lean in the build log, found $n"
            exit 1
          fi

      - name: Axioms of the main theorems
        run: |
          set -o pipefail
          lake env lean scripts/PrintAxioms.lean 2>&1 | tee "$RUNNER_TEMP/axioms.log"
          n="$(grep -c 'depends on axioms' "$RUNNER_TEMP/axioms.log" || true)"
          if [ "$n" -ne 5 ]; then
            echo "::error::expected 5 'depends on axioms' lines, found $n"
            exit 1
          fi
          bad="$(grep -o 'depends on axioms: \[.*\]' "$RUNNER_TEMP/axioms.log" \
            | sed 's/.*\[\(.*\)\]/\1/' | tr ',' '\n' | tr -d ' ' \
            | grep -v -x -E 'propext|Classical\.choice|Quot\.sound' || true)"
          if [ -n "$bad" ]; then
            echo "::error::non-standard axioms: $bad"
            exit 1
          fi

      - name: Restore con-leche
        id: con-leche
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/tools/bin
          key: con-leche-${{ env.CON_LECHE_COMMIT }}

      - name: Build con-leche
        if: steps.con-leche.outputs.cache-hit != 'true'
        run: |
          git init -q ~/tools/con-leche
          cd ~/tools/con-leche
          git fetch -q --depth 1 https://github.com/leanprover/con-leche "$CON_LECHE_COMMIT"
          git checkout -q FETCH_HEAD
          lake build con-leche
          mkdir -p ~/tools/bin
          cp .lake/build/bin/con-leche ~/tools/bin/

      - name: Save con-leche
        if: steps.con-leche.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/tools/bin
          key: con-leche-${{ env.CON_LECHE_COMMIT }}

      - name: Restore con-ron
        id: con-ron
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/tools/bin
          key: con-ron-${{ env.CON_RON_COMMIT }}

      - name: Build con-ron
        if: steps.con-ron.outputs.cache-hit != 'true'
        run: |
          git init -q ~/tools/con-ron
          cd ~/tools/con-ron
          git fetch -q --depth 1 https://github.com/leanprover/con-ron "$CON_RON_COMMIT"
          git checkout -q FETCH_HEAD
          cargo build --release --locked
          mkdir -p ~/tools/bin
          cp target/release/con-ron ~/tools/bin/

      - name: Save con-ron
        if: steps.con-ron.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/tools/bin
          key: con-ron-${{ env.CON_RON_COMMIT }}

      # As in leanprover/comparator, each export holds the theorems of comparator.json and
      # everything they depend on (about 62000 declarations), rather than all of Mathlib.
      - name: Export Challenge and Solution
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          mapfile -t theorems < <(jq -r '.theorem_names[]' comparator.json)
          for m in Challenge Solution; do
            lake env leanexport "$m" -- "${theorems[@]}" > "$RUNNER_TEMP/export/$m.ndjson"
          done
          ls -l "$RUNNER_TEMP/export"

      - name: con-leche --compare
        run: bash .github/scripts/compare.sh ~/tools/bin/con-leche "$RUNNER_TEMP/export"

      - name: con-ron --compare
        run: bash .github/scripts/compare.sh ~/tools/bin/con-ron "$RUNNER_TEMP/export"

      # Lean.trustCompiler is permitted because core's `opaque Lean.reduceNat` mentions it, and
      # nanoda_bin stops with "declaration not found in infer_const" when it meets that opaque
      # without it. This does not weaken the check of the five theorems: their axioms are
      # checked by PrintAxioms above and by both --compare runs, which allow only the three
      # standard axioms.
      - name: nanoda on the Solution export
        run: |
          cat > "$RUNNER_TEMP/nanoda.json" <<EOF
          {
            "export_file_path": "$RUNNER_TEMP/export/Solution.ndjson",
            "num_threads": $(nproc),
            "permitted_axioms": ["propext", "Classical.choice", "Quot.sound", "Lean.trustCompiler"],
            "unpermitted_axiom_hard_error": false,
            "nat_extension": true,
            "string_extension": true,
            "print_success_message": true
          }
          EOF
          lake env nanoda_bin "$RUNNER_TEMP/nanoda.json"

      # Publish this commit's build outputs to the R2 bucket that `lake exe cache get` reads.
      - name: Publish the build to the Lake cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          LAKE_CONFIG: ${{ github.workspace }}/lakefile.toml
          LAKE_CACHE_DIR: ${{ runner.temp }}/lake-cache
          LAKE_ARTIFACT_CACHE: "true"
          LAKE_RESTORE_ARTIFACTS: "true"
          LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
        run: |
          if [ -z "$LAKE_CACHE_KEY" ]; then
            echo "::notice::LAKE_CACHE_KEY is not set; not publishing the build"
            exit 0
          fi
          lake cache put "$RUNNER_TEMP/outputs.jsonl" --service=vp-vnp-upload
